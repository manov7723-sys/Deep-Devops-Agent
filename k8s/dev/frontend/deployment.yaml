apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agentic-app-frontend
  namespace: external-dns
  labels:
    app.kubernetes.io/name: ai-agentic-app-frontend
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-agentic-app-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-agentic-app-frontend
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: ai-agentic-app-frontend
          image: 985465459771.dkr.ecr.us-east-1.amazonaws.com/dynamic-react-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
