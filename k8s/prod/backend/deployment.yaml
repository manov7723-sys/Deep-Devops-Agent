apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-devops-agent-backend
  namespace: level
  labels:
    app.kubernetes.io/name: deep-devops-agent-backend
    app.kubernetes.io/managed-by: deepagent
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: deep-devops-agent-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deep-devops-agent-backend
        app.kubernetes.io/managed-by: deepagent
    spec:
      containers:
        - name: deep-devops-agent-backend
          image: aiagenticappbackend.azurecr.io/deep-devops-agent-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 5
          envFrom:
            - secretRef:
                name: app-db
                optional: true
            - secretRef:
                name: app-env
                optional: true
