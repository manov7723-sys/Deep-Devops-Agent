name: Deploy backend to Kubernetes (CD)

# Runs ONLY after the CI workflow ("Build and push backend to ECR") completes
# successfully, so the image is already in the registry before we deploy.
on:
  workflow_run:
    workflows: ["Build and push backend to ECR"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::985465459771:role/gha-ecr-dynamic-app
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access (keyless)
        run: aws eks update-kubeconfig --name "dev-cluster-1" --region us-east-1

      - name: Ensure namespace exists
        run: kubectl get namespace external-dns || kubectl create namespace external-dns

      - name: Apply manifests
        run: kubectl apply -n external-dns -f k8s/dev/backend/

      - name: Restart rollout (image tag "latest" — force pods onto the new build)
        run: kubectl rollout restart deployment/ai-agentic-app-backend -n external-dns

      - name: Wait for rollout
        run: kubectl rollout status deployment/ai-agentic-app-backend -n external-dns --timeout=180s

      - name: Rollback on failed rollout
        if: failure()
        run: |
          echo "::warning::Rollout of ai-agentic-app-backend failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/ai-agentic-app-backend -n external-dns
          kubectl rollout status deployment/ai-agentic-app-backend -n external-dns --timeout=120s
