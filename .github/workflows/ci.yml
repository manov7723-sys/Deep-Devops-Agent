name: CI (build all services)

# Manual trigger — click "Run" in the Actions tab (or the app's CI/CD Pipelines page).
# When this workflow succeeds, the CD workflow fires automatically via workflow_run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push all services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify backend ACR secrets present
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_AIAGENTICAPPBACKEND_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_AIAGENTICAPPBACKEND_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_AIAGENTICAPPBACKEND_PASSWORD }}
        run: |
          missing=""
          [ -z "$ACR_LOGIN_SERVER" ] && missing="$missing ACR_AIAGENTICAPPBACKEND_LOGIN_SERVER"
          [ -z "$ACR_USERNAME" ] && missing="$missing ACR_AIAGENTICAPPBACKEND_USERNAME"
          [ -z "$ACR_PASSWORD" ] && missing="$missing ACR_AIAGENTICAPPBACKEND_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::DEEPAGENT_ACR_SECRETS_MISSING repo=${{ github.repository }} service=backend missing=$missing"
            exit 1
          fi

      - name: Log in to ACR for backend
        uses: docker/login-action@v3
        with:
          registry: aiagenticappbackend.azurecr.io
          username: ${{ secrets.ACR_AIAGENTICAPPBACKEND_USERNAME }}
          password: ${{ secrets.ACR_AIAGENTICAPPBACKEND_PASSWORD }}

      - name: Build and tag backend image
        env:
          IMAGE: aiagenticappbackend.azurecr.io/deep-devops-agent-backend
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" -f "backend/Dockerfile" "backend"

      - name: Scan backend image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          IMAGE: aiagenticappbackend.azurecr.io/deep-devops-agent-backend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$IMAGE:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push backend image
        env:
          IMAGE: aiagenticappbackend.azurecr.io/deep-devops-agent-backend
          TAG: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Verify frontend ACR secrets present
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_AIAGENTICAPPFRONTEND_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_AIAGENTICAPPFRONTEND_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_AIAGENTICAPPFRONTEND_PASSWORD }}
        run: |
          missing=""
          [ -z "$ACR_LOGIN_SERVER" ] && missing="$missing ACR_AIAGENTICAPPFRONTEND_LOGIN_SERVER"
          [ -z "$ACR_USERNAME" ] && missing="$missing ACR_AIAGENTICAPPFRONTEND_USERNAME"
          [ -z "$ACR_PASSWORD" ] && missing="$missing ACR_AIAGENTICAPPFRONTEND_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::DEEPAGENT_ACR_SECRETS_MISSING repo=${{ github.repository }} service=frontend missing=$missing"
            exit 1
          fi

      - name: Log in to ACR for frontend
        uses: docker/login-action@v3
        with:
          registry: aiagenticappfrontend.azurecr.io
          username: ${{ secrets.ACR_AIAGENTICAPPFRONTEND_USERNAME }}
          password: ${{ secrets.ACR_AIAGENTICAPPFRONTEND_PASSWORD }}

      - name: Build and tag frontend image
        env:
          IMAGE: aiagenticappfrontend.azurecr.io/deep-devops-agent-frontend
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" -f "frontend/Dockerfile" "frontend"

      - name: Scan frontend image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          IMAGE: aiagenticappfrontend.azurecr.io/deep-devops-agent-frontend
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$IMAGE:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push frontend image
        env:
          IMAGE: aiagenticappfrontend.azurecr.io/deep-devops-agent-frontend
          TAG: ${{ github.sha }}
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
