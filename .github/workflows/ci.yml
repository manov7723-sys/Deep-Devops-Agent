name: CI (build all services)

# Manual trigger — click "Run" in the Actions tab (or the app's CI/CD Pipelines page).
# When this workflow succeeds, the CD workflow fires automatically via workflow_run.
on:
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            ecr: 985465459771.dkr.ecr.us-east-1.amazonaws.com/dynamic-app
            context: backend
          - service: frontend
            ecr: 985465459771.dkr.ecr.us-east-1.amazonaws.com/dynamic-react-app
            context: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::985465459771:role/gha-manov7723-sys-ai-agentic-app-dynamic-app
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag ${{ matrix.service }} image
        env:
          ECR: ${{ matrix.ecr }}
          TAG: ${{ github.sha }}
        run: |
          if [ "${{ matrix.context }}" = "." ]; then
            docker build -t "$ECR:$TAG" -t "$ECR:latest" .
          else
            docker build -t "$ECR:$TAG" -t "$ECR:latest" -f "${{ matrix.context }}/Dockerfile" "${{ matrix.context }}"
          fi

      - name: Scan ${{ matrix.service }} image for vulnerabilities (Trivy — stop on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: "${{ matrix.ecr }}:${{ github.sha }}"
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push ${{ matrix.service }} image
        env:
          ECR: ${{ matrix.ecr }}
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"
